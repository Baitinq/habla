[project]
name = "habla"
version = "0.1.0"
description = "Voice-to-text daemon powered by Whisper"
readme = "README.md"
authors = [{ name = "Baitinq", email = "manuelpalenzuelamerino@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "sounddevice>=0.5",
    "pywhispercpp",
]

[project.scripts]
habla = "habla.habla:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources.pywhispercpp]
git = "https://github.com/absadiki/pywhispercpp"
