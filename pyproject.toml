[project]
name = "habla"
version = "0.2.0"
description = "Voice-to-text daemon powered by Parakeet"
readme = "README.md"
authors = [{ name = "Baitinq", email = "manuelpalenzuelamerino@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "sherpa-onnx==1.13.6+cuda12.cudnn9.onnxruntime1.27.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sherpa-onnx==1.13.6; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "sherpa-onnx-core==1.13.6; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "sounddevice>=0.5",
]

[project.scripts]
habla = "habla.habla:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
find-links = ["https://k2-fsa.github.io/sherpa/onnx/cuda.html"]
